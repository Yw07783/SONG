<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4e4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d49090;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 莫兰迪粉渐变背景 -->
  <rect width="512" height="512" rx="120" ry="120" fill="url(#bg)" />
  <!-- 白色宋字 -->
  <text x="256" y="290" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="260" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">宋</text>
  <!-- 底部分隔线 -->
  <rect x="156" y="340" width="200" height="3" rx="1.5" fill="rgba(255,255,255,0.4)" />
</svg>
